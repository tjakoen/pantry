# PANTRY hub: one container per machine serving every project in ~/.pantry/projects.json.
#
#   PANTRY_CODE_ROOT=$HOME/Local docker compose up -d --build
#
# The code root is mounted at the SAME absolute path inside the container, so the registry's host
# paths resolve unchanged. It is read-only: PANTRY reads a project and never writes into it. The
# ports are published on 127.0.0.1 only, which is what makes PANTRY_TRUST_CONTAINER_NETWORK safe;
# never change these bindings to 0.0.0.0. Port 4400 is the hub, 4401 to 4449 are projects.
services:
  pantry:
    build: .
    image: pantry-hub
    container_name: pantry-hub
    restart: unless-stopped
    environment:
      PANTRY_HOME: /pantry-home
    volumes:
      - ${PANTRY_CODE_ROOT:?set PANTRY_CODE_ROOT to the folder that holds your projects}:${PANTRY_CODE_ROOT}:ro
      - ${HOME}/.pantry:/pantry-home
    ports:
      - "127.0.0.1:4400-4449:4400-4449"
