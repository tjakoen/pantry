<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PANTRY</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { text-align: center; max-width: 28rem; padding: 2rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { opacity: .75; line-height: 1.5; margin: 0 0 1.5rem; }
  button { font: inherit; padding: .6rem 1.4rem; border-radius: .5rem; border: 0; background: #2f6f4f; color: white; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  pre { text-align: left; font-size: .8rem; white-space: pre-wrap; opacity: .7; margin-top: 1.5rem; }
  .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: #b44; margin-right: .4rem; }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>The PANTRY hub is offline</h1>
  <p id="why">Nothing answered on port <span id="port">…</span>. Start it here, or start a session: the session-start hook runs <code>pantry hub ensure</code> too. This window switches over as soon as the hub answers.</p>
  <button id="start">Start hub</button>
  <pre id="log"></pre>
</main>
<script>
  const { invoke } = window.__TAURI__.core;
  const btn = document.getElementById("start"), log = document.getElementById("log");
  async function refresh() {
    const s = await invoke("hub_status");
    document.getElementById("port").textContent = s.port || "4400";
  }
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "Starting…"; log.textContent = "";
    try { log.textContent = await invoke("start_hub"); }
    catch (e) { log.textContent = String(e); btn.disabled = false; btn.textContent = "Start hub"; }
  });
  refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
